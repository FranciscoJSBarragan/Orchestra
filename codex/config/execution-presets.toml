# Optional execution assignments, independent of the owning host's model mode.
# WORKFLOW "Delegated execution presets" owns selection and escalation policy.
[presets.standard-delegate]
tier = "standard"

[presets.standard-delegate.capabilities.repository_context]
executor = "grok"
model = "grok-4.6"
reasoning_effort = "high"

[presets.standard-delegate.capabilities.web_research]
executor = "grok"
model = "grok-4.6"
reasoning_effort = "high"

[presets.standard-delegate.capabilities.technical_planning]
executor = "codex"
model = "gpt-6-astra"
reasoning_effort = "low"
prefer_native = true
reuse_root = true

[presets.standard-delegate.capabilities.architecture_analysis]
executor = "codex"
model = "gpt-6-astra"
reasoning_effort = "low"
prefer_native = true
reuse_root = true

[presets.standard-delegate.capabilities.difficult_debugging]
executor = "cursor"
model = "claude-fable-5-1-thinking-low"

[presets.standard-delegate.capabilities.general_implementation]
executor = "cursor"
model = "claude-fable-5-1-thinking-low"

[presets.standard-delegate.capabilities.frontend_implementation]
executor = "cursor"
model = "claude-fable-5-1-thinking-low"

[presets.standard-delegate.capabilities.independent_review]
executor = "cursor"
model = "claude-fable-5-1-thinking-medium"

[presets.standard-delegate.capabilities.runtime_verification]
executor = "grok"
model = "grok-4.6"
reasoning_effort = "high"

[presets.standard-delegate.capabilities.browser_acceptance]
executor = "host"

[presets.standard-delegate.hosts.codex.browser_acceptance]
executor = "native"
model = "gpt-5.6-luna"
reasoning_effort = "xhigh"

# One bounded ladder shared by implementation and difficult debugging.
# Attempt one uses its capability row; no process retries itself.
[presets.standard-delegate.escalation]
capabilities = ["general_implementation", "frontend_implementation", "difficult_debugging"]

[[presets.standard-delegate.escalation.attempts]]
executor = "cursor"
model = "claude-fable-5-1-thinking-high"

[[presets.standard-delegate.escalation.attempts]]
executor = "codex"
model = "gpt-6-astra"
reasoning_effort = "low"
prefer_native = true

# Every role stays on the owning host's matrix except independent review,
# which runs on another model family: same-family reviewers share blind spots.
[presets.cross-review]
tier = "standard"

[presets.cross-review.capabilities.repository_context]
executor = "host"

[presets.cross-review.capabilities.web_research]
executor = "host"

[presets.cross-review.capabilities.technical_planning]
executor = "host"

[presets.cross-review.capabilities.architecture_analysis]
executor = "host"

[presets.cross-review.capabilities.difficult_debugging]
executor = "host"

[presets.cross-review.capabilities.general_implementation]
executor = "host"

[presets.cross-review.capabilities.frontend_implementation]
executor = "host"

[presets.cross-review.capabilities.independent_review]
executor = "claude"
model = "claude-sonnet-5-5"
reasoning_effort = "high"

[presets.cross-review.capabilities.runtime_verification]
executor = "host"

[presets.cross-review.capabilities.browser_acceptance]
executor = "host"

[presets.cross-review.hosts.claude.independent_review]
executor = "codex"
model = "gpt-6.1-sol"
reasoning_effort = "high"

[presets.cross-review.escalation]
capabilities = ["general_implementation", "frontend_implementation", "difficult_debugging"]

[[presets.cross-review.escalation.attempts]]
executor = "claude"
model = "claude-sonnet-5-5"
reasoning_effort = "high"

[[presets.cross-review.escalation.attempts]]
executor = "codex"
model = "gpt-6.1-sol"
reasoning_effort = "high"

# Each capability on the model family chosen for it from measured role runs;
# a dedicated Opus xhigh planner. Inside T3 Code these run through delegate_task.
[presets.mixed-models]
tier = "standard"

[presets.mixed-models.capabilities.repository_context]
executor = "codex"
model = "gpt-6.1-sol"
reasoning_effort = "high"

[presets.mixed-models.capabilities.web_research]
executor = "grok"
model = "grok-4.7-build-fast"
reasoning_effort = "high"

[presets.mixed-models.capabilities.technical_planning]
executor = "claude"
model = "claude-opus-5-5"
reasoning_effort = "xhigh"

[presets.mixed-models.capabilities.architecture_analysis]
executor = "claude"
model = "claude-opus-5-5"
reasoning_effort = "medium"
reuse_root = true

[presets.mixed-models.capabilities.difficult_debugging]
executor = "codex"
model = "gpt-6.1-sol"
reasoning_effort = "high"

[presets.mixed-models.capabilities.general_implementation]
executor = "claude"
model = "claude-opus-5-5"
reasoning_effort = "medium"

[presets.mixed-models.capabilities.frontend_implementation]
executor = "claude"
model = "claude-opus-5-5"
reasoning_effort = "medium"

[presets.mixed-models.capabilities.independent_review]
executor = "codex"
model = "gpt-6.1-sol"
reasoning_effort = "high"

[presets.mixed-models.capabilities.runtime_verification]
executor = "claude"
model = "claude-haiku-5-5"
reasoning_effort = "high"

[presets.mixed-models.capabilities.browser_acceptance]
executor = "host"

[presets.mixed-models.hosts]

[presets.mixed-models.escalation]
capabilities = ["general_implementation", "frontend_implementation", "difficult_debugging"]

[[presets.mixed-models.escalation.attempts]]
executor = "claude"
model = "claude-opus-5-5"
reasoning_effort = "high"

[[presets.mixed-models.escalation.attempts]]
executor = "codex"
model = "gpt-6.1-sol"
reasoning_effort = "high"
