# Grok Build host assignment matrix.
# Product tiers named by Orchestra are minimal, standard, and critical.
# This cut assigns standard and critical. Selecting minimal must block:
# the live catalog is grok-4.6 at the same cost, so there is no cheaper row.
# Critical uses the same spawn rows as standard; it raises root scrutiny,
# not model or reasoning. spawn.md maps these names onto live primitives.
# Effort is inherit: Grok spawn does not expose a per-dispatch reasoning
# override.

[tiers.standard.repository_context]
profile = "orchestra_analyst"
subagent_type = "general-purpose"
model = "grok-4.6"
effort = "inherit"

