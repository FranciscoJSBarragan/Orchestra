# Grok Build host assignment matrix.
# Product tiers are minimal, standard, and critical. This cut assigns
# minimal and standard. Selecting critical must block until those rows exist.
# Fields: profile is the Orchestra behavior skill; subagent_type is the Grok
# spawn_subagent type; model and effort are the product contract. spawn.md
# maps those names onto live Grok primitives. Effort is inherit: Grok spawn
# does not expose a per-dispatch reasoning override.

[tiers.minimal.repository_context]
profile = "orchestra_analyst"
subagent_type = "general-purpose"
model = "grok-4.5"
effort = "inherit"

