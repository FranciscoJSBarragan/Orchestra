# Grok Build host assignment matrix.
# Product tiers named by Orchestra are minimal, standard, and critical.
# This cut assigns standard and critical. Selecting minimal must block:
# the live catalog row is grok-4.6 at effort xhigh, so there is
# no cheaper row. Critical uses the same spawn rows as standard; it raises
# root scrutiny, not model or reasoning. spawn.md maps these names onto
# live primitives. Pass effort only on a transport that accepts it.
# Verifier rows express availability only. A phase gate of `none` creates no
# verifier subagent.

[tiers.standard.repository_context]
profile = "orchestra_analyst"
subagent_type = "general-purpose"
model = "grok-4.6"
effort = "xhigh"

