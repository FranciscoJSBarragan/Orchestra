# Claude Code host assignment matrix.
# Product tiers are minimal, standard, and critical. This cut assigns all three.
# Reasoning capabilities (planning, architecture, debugging, implementation,
# review) and fast capabilities (repository context, web research,
# verification) differ by model and effort, not by role behavior.
# The Agent tool accepts a per-dispatch model but no effort, so effort is
# pinned in the registered profile: subagent_type is always
# `<profile>_<effort>`. spawn.md maps product models onto Agent aliases.
# Verifier rows express availability only. A phase gate of `none` creates no
# verifier subagent.

[tiers.minimal.repository_context]
profile = "orchestra_analyst"
subagent_type = "orchestra_analyst_low"
model = "claude-sonnet-5-5"
effort = "low"

[tiers.minimal.web_research]
